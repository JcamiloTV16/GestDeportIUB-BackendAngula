<!-- Floating Toggle Button -->
<button class="chat-fab" (click)="toggleChat()" [class.open]="isOpen">
  <i class="bi" [ngClass]="isOpen ? 'bi-x-lg' : 'bi-chat-dots-fill'"></i>
  <span *ngIf="hasNewMessage && !isOpen" class="notification-badge"></span>
</button>

<!-- Chat Panel -->
<div class="chat-panel" [class.visible]="isOpen">

  <!-- Panel Header -->
  <div class="panel-header">
    <div class="panel-header-left w-100 me-2">
      <div class="panel-avatar">
        <i class="bi bi-person-lines-fill"></i>
      </div>
      <div class="flex-grow-1">
        <h6 class="mb-0 fw-bold">Mensajería Directa</h6>
        <div *ngIf="contacts.length > 0" class="mt-1">
          <select
            class="form-select form-select-sm text-dark bg-light border-0 py-0"
            style="font-size: 0.78rem;"
            [(ngModel)]="selectedContactId"
          >
            <option *ngFor="let c of contacts" [value]="c.id">
              {{ c.nombre }} ({{ c.rol }})
            </option>
          </select>
        </div>
        <small *ngIf="contacts.length === 0" class="panel-status text-warning">
          Sin contactos disponibles
        </small>
      </div>
    </div>
    <button class="panel-close" (click)="closeChat()">
      <i class="bi bi-dash-lg"></i>
    </button>
  </div>

  <!-- Connection Status Banner -->
  <div class="px-3 py-1 bg-light border-bottom d-flex align-items-center justify-content-between">
    <small class="panel-status" [ngClass]="{'text-success': isConnected, 'text-warning': !isConnected}">
      <span class="panel-dot" [style.background-color]="isConnected ? '#10b981' : '#f59e0b'"></span>
      {{ isConnected ? 'En línea' : 'Reconectando...' }}
    </small>
    <small *ngIf="selectedContact" class="text-muted ms-2 text-truncate" style="max-width: 140px;">
      Para: <strong>{{ selectedContact.nombre }}</strong>
    </small>
  </div>

  <!-- Panel Messages -->
  <div class="panel-messages" #widgetMessages>
    <div *ngFor="let msg of activeMessages" class="w-msg" [ngClass]="msg.sender">
      <div *ngIf="msg.sender === 'bot' || msg.sender === 'system'" class="w-bot-avatar">
        <i class="bi" [ngClass]="msg.sender === 'system' ? 'bi-info-circle-fill' : 'bi-person-circle'"></i>
      </div>
      <div class="w-bubble" [ngClass]="msg.sender">
        <div *ngIf="msg.senderName && msg.sender !== 'user'" class="fw-bold small mb-1 text-primary">
          {{ msg.senderName }}
        </div>
        <div class="w-text" [innerHTML]="msg.text"></div>
        <div class="w-time">{{ msg.timestamp | date:'HH:mm' }}</div>
      </div>
    </div>
  </div>

  <!-- Panel Input -->
  <div class="panel-input">
    <input
      type="text"
      [(ngModel)]="userInput"
      (keydown)="onKeyDown($event)"
      [placeholder]="selectedContact ? 'Escribir a ' + selectedContact.nombre + '...' : 'Selecciona un contacto...'"
      [disabled]="!isConnected || !selectedContactId"
      autocomplete="off"
    />
    <button (click)="enviarMensaje()" [disabled]="!userInput.trim() || !isConnected || !selectedContactId">
      <i class="bi bi-send-fill"></i>
    </button>
  </div>
</div>
